name: PR Lens
description: Post the architecture and data flow of a pull request as diagrams in its comments, using your own model key.
author: Coldtea AI

branding:
  icon: git-pull-request
  color: purple

inputs:
  api-key:
    description: Key for the model provider. It is passed to the CLI through the environment and never appears in a command line.
    required: true
  provider:
    description: >-
      gemini, openai, or openai-compatible for anything else speaking
      /chat/completions (which then needs base-url).
    default: gemini
  model:
    description: Model to ask. Required when provider is openai-compatible, since the endpoint decides which names exist.
    default: ""
  base-url:
    description: Provider endpoint, for a compatible or self-hosted server.
    default: ""
  lens:
    description: Comma-separated lenses to render. Defaults to both.
    default: ""
  branding:
    description: Show the "Rendered by PR Lens" footer.
    default: "true"
  comment:
    description: Post the comment. Set false to render and publish the SVGs without commenting.
    default: "true"
  data-branch:
    description: Orphan branch the rendered SVGs are committed to. It holds no code and is never merged.
    default: pr-lens
  cli-version:
    description: Version of @coldtea/pr-lens-cli to run when cli-source is npm.
    default: 0.5.1
  cli-source:
    description: "CLI source: npm or workspace. Use workspace with this fork to include source-linking changes."
    default: npm
  comment-author:
    description: >-
      Login that owns the PR Lens comment. Only a comment posted by this
      account is ever updated, so nobody else can put the marker on a comment
      of their own and have this Action edit it. Change it when github-token
      belongs to another identity.
    default: github-actions[bot]
  github-token:
    description: Token used to publish the SVGs and post the comment.
    default: ${{ github.token }}
  canvas-url:
    description: Base URL of the compatible interactive canvas service. Leave empty to skip canvas publishing.
    default: ""
  canvas-publish-token:
    description: Service token accepted by the private canvas publish endpoint.
    default: ""

outputs:
  graph:
    description: Path of the graph document that was produced.
    value: ${{ steps.analyze.outputs.graph }}
  assets-url:
    description: Base URL the rendered SVGs are published at.
    value: ${{ steps.publish.outputs.assets-url }}
  canvas-url:
    description: URL of the interactive canvas for this pull request.
    value: ${{ steps.canvas.outputs.canvas-url }}

runs:
  using: composite
  steps:
    - name: Check the run has what it needs
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${PR_NUMBER}" ]; then
          echo "::error::PR Lens runs on pull_request events — there is no pull request in this one."
          exit 1
        fi
        for SHA in "${BASE_SHA}" "${HEAD_SHA}"; do
          if ! git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
            echo "::error::${SHA} is not in this checkout. PR Lens diffs two commits, so check out with fetch-depth: 0."
            exit 1
          fi
        done
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build workspace CLI
      if: inputs.cli-source == 'workspace'
      shell: bash
      run: |
        set -euo pipefail
        corepack prepare pnpm@10.5.2 --activate
        pnpm --dir "${GITHUB_ACTION_PATH}" install --frozen-lockfile
        pnpm --dir "${GITHUB_ACTION_PATH}" --filter @coldtea/pr-lens-cli... run build

    - name: Analyze the diff
      id: analyze
      shell: bash
      run: |
        set -euo pipefail
        args=(analyze
          --base "${BASE_SHA}"
          --head "${HEAD_SHA}"
          --pr "${PR_NUMBER}"
          --provider "${PROVIDER}"
          --api-key-env PR_LENS_API_KEY
          --out "${RUNNER_TEMP}/pr-lens/graph.json")
        [[ -n "${MODEL}" ]] && args+=(--model "${MODEL}")
        [[ -n "${BASE_URL}" ]] && args+=(--base-url "${BASE_URL}")
        [[ -n "${LENS}" ]] && args+=(--lens "${LENS}")
        bash "${GITHUB_ACTION_PATH}/scripts/run-cli.sh" "${args[@]}"
        echo "graph=${RUNNER_TEMP}/pr-lens/graph.json" >> "${GITHUB_OUTPUT}"
      env:
        ACTION_PATH: ${{ github.action_path }}
        CLI_SOURCE: ${{ inputs.cli-source }}
        CLI_VERSION: ${{ inputs.cli-version }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PROVIDER: ${{ inputs.provider }}
        MODEL: ${{ inputs.model }}
        BASE_URL: ${{ inputs.base-url }}
        LENS: ${{ inputs.lens }}
        PR_LENS_API_KEY: ${{ inputs.api-key }}

    # Corrections are applied here, so this writes the document the diagrams
    # actually show alongside them, and the comment is composed from that one.
    - name: Render the diagrams
      shell: bash
      run: |
        set -euo pipefail
        bash "${GITHUB_ACTION_PATH}/scripts/run-cli.sh" render "${RUNNER_TEMP}/pr-lens/graph.json" \
          --out "${RUNNER_TEMP}/pr-lens/assets"
      env:
        ACTION_PATH: ${{ github.action_path }}
        CLI_SOURCE: ${{ inputs.cli-source }}
        CLI_VERSION: ${{ inputs.cli-version }}

    - name: Publish the SVGs
      id: publish
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/scripts/publish.sh"
      env:
        DATA_BRANCH: ${{ inputs.data-branch }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}

    - name: Publish the interactive canvas
      id: canvas
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/scripts/publish-canvas.sh"
      env:
        CANVAS_API: ${{ inputs.canvas-url }}
        CANVAS_PUBLISH_TOKEN: ${{ inputs.canvas-publish-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GRAPH: ${{ steps.analyze.outputs.graph }}
        PR_NUMBER: ${{ github.event.pull_request.number }}

    - name: Post the comment
      if: inputs.comment == 'true'
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/scripts/comment.sh"
      env:
        ACTION_PATH: ${{ github.action_path }}
        CLI_SOURCE: ${{ inputs.cli-source }}
        CLI_VERSION: ${{ inputs.cli-version }}
        ASSETS_URL: ${{ steps.publish.outputs.assets-url }}
        CANVAS_URL: ${{ steps.canvas.outputs.canvas-url }}
        BRANDING_OFF: ${{ inputs.branding == 'false' && '1' || '' }}
        COMMENT_AUTHOR: ${{ inputs.comment-author }}
        GH_TOKEN: ${{ inputs.github-token }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
